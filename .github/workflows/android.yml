name: TASC Android APK Builder

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Base Android Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libbz2-dev libffi-dev libssl-dev
        pip install --upgrade buildozer cython requests

    - name: Build Android APK with Buildozer Cloud Toolchain
      run: |
        # Checking if spec exists, else init
        if [ ! -f buildozer.spec ]; then
          buildozer init
          sed -i 's/android.api = 33/android.api = 34/' buildozer.spec
          sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        fi
        yes | buildozer android debug
      env:
        BUILDOZER_WARN_ON_ROOT: 1

    - name: Upload Real Installable APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: TASC_Mobile_Console_APK
        path: bin/*.apk
