name: TASC Android APK Builder

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Base Android Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libbz2-dev libffi-dev libssl-dev
        pip install --upgrade buildozer cython requests

    - name: Initialize Buildozer Spec Configuration
      run: |
        buildozer init
        # Automatic spec adjustments via sed scripting to pass parameters safely
        sed -i 's/title = My Application/title = TASC Overlord/' buildozer.spec
        sed -i 's/package.name = myapp/package.name = tascmobileapp/' buildozer.spec
        sed -i 's/package.domain = org.test/package.domain = org.tasc/' buildozer.spec
        sed -i 's/android.api = 33/android.api = 34/' buildozer.spec
        sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec

    - name: Build Android APK with Buildozer Cloud Toolchain
      run: |
        yes | buildozer android debug
      env:
        # Internal configuration variables
        BUILDOZER_WARN_ON_ROOT: 1

    - name: Upload Real Installable APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: TASC_Mobile_Console_APK
        path: bin/*.apk
